# Baut ghcr.io/lizzard77/chatto-gallery-sidecar:latest und :<sha> bei jedem Push auf main
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-Test (Server startet, /api/me antwortet)
        run: |
          docker build -t gallery-test .
          docker run -d --name gallery-test -e DEV_USER=Test -p 8080:8080 gallery-test
          for i in $(seq 20); do curl -fs http://localhost:8080/api/me && break; sleep 1; done
          curl -fs http://localhost:8080/api/me | grep -q '"name":"Test"'
          curl -fs http://localhost:8080/ | grep -qi '<html'
          curl -fsI http://localhost:8080/vendor/pdfjs/pdf.min.mjs
          docker rm -f gallery-test
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/lizzard77/chatto-gallery-sidecar
          tags: |
            ghcr.io/lizzard77/chatto-gallery-sidecar:latest
            ghcr.io/lizzard77/chatto-gallery-sidecar:${{ steps.v.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
