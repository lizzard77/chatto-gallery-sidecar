# Baut ghcr.io/lizzard77/chatto-gallery-sidecar:latest und :<sha> bei jedem Push auf main
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: nginx-Konfiguration prüfen
        run: |
          docker build -t gallery-test .
          mkdir -p /tmp/auth && echo 'test:$apr1$x$x' > /tmp/auth/htpasswd
          docker run --rm -v /tmp/auth:/etc/nginx/auth:ro gallery-test nginx -t
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/lizzard77/chatto-gallery-sidecar
          tags: |
            ghcr.io/lizzard77/chatto-gallery-sidecar:latest
            ghcr.io/lizzard77/chatto-gallery-sidecar:${{ steps.v.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
