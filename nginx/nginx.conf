# Galerie für Charakterbögen: statische Seite + Ordnerlisten als JSON + Vorschaubilder.
#   /             die Galerie-Seite (web/)
#   /files/...    Dateien aus /srv/gallery; Ordner liefern ihre Liste als JSON
#   /thumb/...    verkleinerte Bilder (image_filter), zwischengespeichert
# Alles hinter HTTP Basic Auth (/etc/nginx/auth/htpasswd) – fehlt die Datei, startet nginx nicht.

load_module modules/ngx_http_image_filter_module.so;

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    charset utf-8;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    proxy_cache_path /tmp/thumbs levels=1:2 keys_zone=thumbs:4m max_size=512m inactive=30d use_temp_path=off;

    server {
        listen 8080;
        listen [::]:8080;

        auth_basic "Spielrunden";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "same-origin" always;

        root /usr/share/nginx/html;

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location /files/ {
            alias /srv/gallery/;
            autoindex on;
            autoindex_format json;
            # Versteckte Dateien (.DS_Store, .thumbs …) nicht ausliefern
            location ~ /\. { return 404; }
        }

        location /thumb/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_cache thumbs;
            proxy_cache_valid 200 30d;
            # Die Seite hängt ?v=<mtime> an: eine ersetzte Datei bekommt ein neues Vorschaubild
            proxy_cache_key $request_uri;
            add_header X-Thumb-Cache $upstream_cache_status;
        }
    }

    # Intern: verkleinert Bilder für /thumb/
    server {
        listen 127.0.0.1:8081;
        location / {
            alias /srv/gallery/;
            image_filter resize 640 640;
            image_filter_jpeg_quality 82;
            image_filter_webp_quality 82;
            image_filter_buffer 40M;
            image_filter_interlace on;
        }
    }
}
